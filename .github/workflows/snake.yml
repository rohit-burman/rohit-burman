name: Contribution snake

on:
  schedule:
    # Thursday 03:47 UTC (09:17 IST)
    - cron: "47 3 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate snake SVGs
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#F59F00&color_dots=#EBEDF0,#FFD6E7,#FAA2C1,#E64980,#C2255C
            dist/github-snake-dark.svg?color_snake=#FFD43B&color_dots=#161B22,#5C1A33,#9C2A55,#D6336C,#F06595

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

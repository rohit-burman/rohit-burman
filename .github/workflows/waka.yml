# Weekly WakaTime stats for the README.
# To remove the feature: delete this file and the "lately" block in README.md.
name: Weekly dev stats

on:
  schedule:
    # Once a week: Thursday 03:17 UTC (08:47 IST)
    - cron: "17 3 * * 4"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SECTION_NAME: waka
          COMMIT_MESSAGE: "chore: weekly dev stats"

          # Keep it small: only what's worth showing
          SHOW_TOTAL_CODE_TIME: "True"
          SHOW_LANGUAGE: "True"
          SHOW_EDITORS: "True"
          SHOW_COMMIT: "True" # early bird / night owl
          SHOW_UPDATED_DATE: "True"

          # Everything else off
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_PROJECTS: "False"
          SHOW_OS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_LOC_CHART: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
